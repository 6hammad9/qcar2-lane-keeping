controller_server:
  ros__parameters:
    controller_frequency: 50.0  # Higher frequency for smoother control
    controller_plugins: ["FollowPath"]
    
    # Goal checker
    goal_checker_plugins: ["goal_checker"]
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.25
      stateful: True
    
    # Regulated Pure Pursuit Controller
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      
      # Speed configuration (matches your current setup)
      desired_linear_vel: 0.4
      max_linear_vel: 0.4
      min_linear_vel: 0.10
      
      # Lookahead configuration
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.2
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.8
      
      # Curvature regulation (critical for your 0.51 rad limit)
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.8
      regulated_linear_scaling_min_speed: 0.12
      
      # Collision detection (optional but recommended)
      use_collision_detection: false  # Set true if you have obstacle detection
      max_allowed_time_to_collision_up_to_carrot: 1.0
      
      # Goal approach
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.5
      
      # Rotation handling
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.8
      rotate_to_heading_min_angle: 0.785
      
      # Transform tolerance
      transform_tolerance: 0.1