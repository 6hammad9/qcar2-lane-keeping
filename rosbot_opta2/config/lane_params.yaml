# Image geometry
image:
  width: 768
  height: 432
  strip_top_fraction: 0.72

# White segmentation
segmentation:
  hsv_low: [0, 0, 170]
  hsv_high: [180, 45, 255]
  morph_close_iterations: 2

# Lane detection
detection:
  corridor_px: 40
  split_fraction: 0.40
  lane_width_px: 220

# Controller (for perception-based lane keeping)
control:
  kp: 0.30
  kd: 0.02
  drive_speed: 0.20
  max_error_to_drive: 0.70
  no_detection_stop_frames: 10

# Topics
topics:
  image: "/rosbot3/oak/rgb/image_raw"
  cmd_vel: "/rosbot3/cmd_vel"
  scan: "/rosbot3/scan"

# Debug
debug:
  show_display: true

# Trajectory following (AMCL-based)
trajectory:
  file: "config/slam_trajectory.csv"

  # Pure pursuit
  lookahead_distance: 0.5
  min_lookahead: 0.3
  max_lookahead: 1.0

  # Speed control
  max_speed: 0.20
  min_speed: 0.05
  curve_speed: 0.10
  curvature_threshold: 0.5

  # Tolerances
  goal_tolerance: 0.10
  start_tolerance: 0.15
  angle_tolerance: 0.10

  # Control
  kp_angular: 1.5
  max_angular: 1.0

  # Reverse detection
  reverse_angle_threshold: 120

# Obstacle avoidance
obstacle:
  stop_dist: 0.4
  slow_dist: 0.8
  following_distance: 0.5
  front_angle_range: 30
  side_angle_min: 30
  side_angle_max: 90

# Overtaking
overtake:
  offset: 0.5
  straight_check_distance: 2.0
  max_heading_change: 15
  min_side_clearance: 0.6
  prefer_left: true
